<script>
const layers = [
    "OUR/index.html",
    "AQUA/index.html",
    "ICE/index.html",
    "RESPO/index.html",
    "VITALITY.html"
];

let pos = 0;

async function loadLayer() {
    const url = layers[pos];
    const frame = document.getElementById("geoFrame");

    try {
        const res = await fetch(url, { cache: "no-store" });

        if (!res.ok) {
            // IMMER deine eigene 404
            frame.src = "404.html";
        } else {
            frame.src = url;
        }

    } catch {
        // IMMER deine eigene 404
        frame.src = "404.html";
    }

    pos = (pos + 1) % layers.length;
}

setInterval(loadLayer, 2000);
</script>
