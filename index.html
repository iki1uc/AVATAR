<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AVATAR — GEO Evolution</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #66ccff;
        font-family: monospace;
        text-align: center;
        padding-top: 10vh;
        letter-spacing: 2px;
    }

    iframe {
        width: 100vw;
        height: 80vh;
        border: none;
    }

    h1 {
        font-weight: normal;
    }
</style>

</head>
<body>

<h1>AVATAR — GEO Evolution</h1>

<iframe id="geoFrame" src="VITALITY.html"></iframe>

<script>
    const layers = [
        "OUR/index.html",       // Ursprung / Zeichen
        "AQUA/index.html",      // Flow / Pulse
        "ICE/index.html",       // Kristall / Ü / F
        "RESPO/index.html",     // Antwort / Reaktion
        "VITALITY.html"         // Lebensenergie
    ];

    let pos = 0;

    setInterval(() => {
        pos = (pos + 1) % layers.length;
        document.getElementById("geoFrame").src = layers[pos];
    }, 2000);
</script>

</body>
</html>
